name: Deploy to AWS S3 + CloudFront

on:
  push:
    branches:
      - main
    tags:
      - 'v*'  # v1.0.0 형식의 태그 Push 시 전체 무효화
  repository_dispatch:
    types: [content-update]  # 백엔드 상품 변경 시 자동 재빌드 (searchPing.service)
  workflow_dispatch:  # 수동 실행 지원
    inputs:
      full_invalidation:
        description: '전체 캐시 무효화 (디자인 변경, 긴급 수정 시)'
        required: false
        type: boolean
        default: false
      maintenance_mode:
        description: '⚠️ 준비 중 모드: 사이트를 Coming Soon 안내 페이지로 교체 (기존 prerender 산출물 전부 삭제됨)'
        required: false
        type: boolean
        default: false

env:
  NODE_VERSION: "20"

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Node.js 설정
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: "npm"

      # 3. 의존성 설치
      - name: Install dependencies
        run: npm ci

      # 4. 프로덕션 빌드 + Prerendering (운영 API/DB 기준)
      # maintenance_mode에서는 건너뛴다 — prerender가 살아있는 백엔드 API를 필수로 호출하므로
      # 백엔드를 내린 상태에서는 이 스텝이 반드시 실패한다(fail-closed).
      - name: Build and Prerender
        if: inputs.maintenance_mode != true
        run: npm run build:full
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_KAKAO_APP_KEY: ${{ secrets.VITE_KAKAO_APP_KEY }}

      # 4-M. 준비 중 모드 빌드 (백엔드·DB 불필요)
      # 수동 실행(workflow_dispatch)에서 maintenance_mode를 켰을 때만 동작한다.
      - name: Build maintenance page
        if: inputs.maintenance_mode == true
        run: |
          echo "::warning::준비 중 모드로 배포합니다 — 기존 prerender 산출물(상품/카테고리/FAQ/sitemap)이 S3에서 삭제됩니다"
          npm run build:maintenance

      # 5. AWS 자격 증명 설정
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # 6. Assets 파일 업로드 (긴 캐시 TTL: 1년, immutable)
      - name: Upload Assets to S3
        run: |
          aws s3 sync dist/assets/ s3://${{ secrets.AWS_S3_BUCKET_NAME }}/assets/ \
            --cache-control "max-age=31536000, immutable"

      # 6-1. Assets 업로드 완료 확인
      - name: Wait for assets upload completion
        run: |
          echo "⏳ Assets 업로드 완료 대기 중..."
          sleep 3
          echo "✅ Assets 준비 완료 - HTML 업로드 시작"

      # 7. HTML 파일 업로드 (짧은 캐시 TTL: 5분 + stale-while-revalidate 24시간)
      - name: Upload HTML files to S3
        run: |
          aws s3 sync dist/ s3://${{ secrets.AWS_S3_BUCKET_NAME }} \
            --exclude "assets/*" \
            --cache-control "max-age=300, stale-while-revalidate=86400" \
            --delete

      # 7-1. SEO/LLM 텍스트 파일 Content-Type + charset 명시
      # 준비 중 모드에는 llms.txt/sitemap.xml이 없으므로 존재하는 파일만 처리한다
      # (없는 파일에 aws s3 cp를 하면 스텝 전체가 실패한다)
      - name: Set UTF-8 metadata for SEO files
        run: |
          upload_text() {
            local file="$1" content_type="$2"
            if [ ! -f "dist/$file" ]; then
              echo "⏭️  dist/$file 없음 - 건너뜀"
              return 0
            fi
            aws s3 cp "dist/$file" "s3://${{ secrets.AWS_S3_BUCKET_NAME }}/$file" \
              --content-type "$content_type" \
              --cache-control "max-age=300, stale-while-revalidate=86400"
          }

          upload_text robots.txt "text/plain; charset=utf-8"
          upload_text llms.txt "text/plain; charset=utf-8"
          upload_text sitemap.xml "application/xml; charset=utf-8"

      # 7-2. S3 Lifecycle 규칙 보장 (60일 지난 assets/ 자동 삭제)
      # - 매 배포마다 재적용(멱등)해 콘솔 설정 유실 시에도 자동 복구
      # - assets는 매 배포마다 재업로드되어 타임스탬프가 갱신되므로,
      #   60일 이상 배포 공백이 없는 한 현역 청크는 삭제되지 않음
      # - Prefix "assets/" 한정 필수: index.html·robots·sitemap 등 루트 객체는 대상 외
      # - IAM 권한(s3:PutLifecycleConfiguration) 부재 시 경고만 남기고 배포는 계속
      - name: Ensure S3 lifecycle rule for old assets
        run: |
          aws s3api put-bucket-lifecycle-configuration \
            --bucket ${{ secrets.AWS_S3_BUCKET_NAME }} \
            --lifecycle-configuration '{
              "Rules": [{
                "ID": "expire-old-assets-60d",
                "Filter": { "Prefix": "assets/" },
                "Status": "Enabled",
                "Expiration": { "Days": 60 }
              }]
            }' \
          && echo "✅ Lifecycle 규칙 적용 완료 (assets/ 60일)" \
          || echo "::warning::Lifecycle 규칙 적용 실패 — IAM에 s3:PutLifecycleConfiguration 권한이 있는지 확인 필요 (배포는 계속 진행)"

      # 8. 무효화 전략 판단 및 실행
      - name: Determine invalidation strategy
        id: invalidation
        run: |
          # 커밋 메시지에 [full-invalidate] 키워드 확인
          COMMIT_MSG="${{ github.event.head_commit.message }}"

          # 조건 체크
          # 준비 중 모드는 전 경로가 안내 페이지로 바뀌므로 반드시 전체 무효화한다
          # (선택적 무효화는 상품/카테고리 경로를 일부만 지워 옛 페이지가 캐시에 남는다)
          if [[ "${{ github.ref_type }}" == "tag" ]] || \
             [[ "${{ inputs.full_invalidation }}" == "true" ]] || \
             [[ "${{ inputs.maintenance_mode }}" == "true" ]] || \
             [[ "$COMMIT_MSG" == *"[full-invalidate]"* ]]; then
            echo "strategy=full" >> $GITHUB_OUTPUT
            echo "🔄 전체 캐시 무효화 실행"
          else
            echo "strategy=selective" >> $GITHUB_OUTPUT
            echo "📄 HTML만 선택적 무효화 실행"
          fi

      # 9-A. HTML만 선택적 캐시 무효화 (비용 절감)
      - name: Invalidate CloudFront cache (HTML only)
        if: steps.invalidation.outputs.strategy == 'selective'
        run: |
          echo "📄 HTML 캐시 무효화 중..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/index.html" "/faq" "/faq.html" "/terms" "/terms.html" "/privacy" "/privacy.html" "/product/*" "/productDetail/*" "/sitemap.xml" "/robots.txt" "/llms.txt" \
            --query 'Invalidation.Id' \
            --output text)

          echo "무효화 ID: $INVALIDATION_ID"

          # 무효화 완료 대기 (최대 5분)
          echo "⏳ 무효화 완료 대기 중..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id $INVALIDATION_ID \
            --cli-read-timeout 300 || echo "⚠️  타임아웃 (백그라운드에서 계속 진행됨)"

          echo "✅ 무효화 완료"

      # 9-B. 전체 캐시 무효화 (디자인 변경, 긴급 수정 시)
      - name: Invalidate CloudFront cache (Full)
        if: steps.invalidation.outputs.strategy == 'full'
        run: |
          echo "🔄 전체 캐시 무효화 중..."
          INVALIDATION_ID=$(aws cloudfront create-invalidation \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --paths "/*" \
            --query 'Invalidation.Id' \
            --output text)

          echo "무효화 ID: $INVALIDATION_ID"

          # 무효화 완료 대기 (최대 10분, 전체 무효화는 더 오래 걸릴 수 있음)
          echo "⏳ 무효화 완료 대기 중..."
          aws cloudfront wait invalidation-completed \
            --distribution-id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --id $INVALIDATION_ID \
            --cli-read-timeout 600 || echo "⚠️  타임아웃 (백그라운드에서 계속 진행됨)"

          echo "✅ 무효화 완료"

      # 9-C. IndexNow 색인 핑 (무효화 완료 후 — 페이지가 실존해야 핑이 유효)
      # 최근 변경된 URL을 네이버/빙 등 IndexNow 지원 검색엔진에 즉시 알림
      # 준비 중 모드에서는 건너뛴다 — sitemap을 배포하지 않고 전 URL이 안내 페이지로
      # 폴백되므로, 색인 핑을 보내면 중복 페이지 재크롤만 유발한다.
      - name: Ping IndexNow
        if: inputs.maintenance_mode != true
        run: node scripts/indexnow-ping.js

      # 10. 배포 검증 (Cache-Control 헤더 확인)
      - name: Verify Cache-Control Headers
        run: |
          echo "🔍 Cache-Control 헤더 검증 중..."

          # S3 index.html 확인
          INDEX_CACHE=$(aws s3api head-object \
            --bucket ${{ secrets.AWS_S3_BUCKET_NAME }} \
            --key index.html \
            --query 'CacheControl' \
            --output text)
          echo "   index.html: $INDEX_CACHE"

          if [[ "$INDEX_CACHE" != *"max-age=300"* ]] || [[ "$INDEX_CACHE" != *"stale-while-revalidate"* ]]; then
            echo "❌ index.html의 Cache-Control이 잘못되었습니다"
            echo "   예상: max-age=300, stale-while-revalidate=86400"
            exit 1
          fi

          # Assets 확인 (랜덤 샘플링)
          ASSET_FILE=$(aws s3 ls s3://${{ secrets.AWS_S3_BUCKET_NAME }}/assets/ \
            | grep '\.js$' | head -1 | awk '{print $4}')

          if [ -n "$ASSET_FILE" ]; then
            ASSET_CACHE=$(aws s3api head-object \
              --bucket ${{ secrets.AWS_S3_BUCKET_NAME }} \
              --key "assets/$ASSET_FILE" \
              --query 'CacheControl' \
              --output text)
            echo "   assets/$ASSET_FILE: $ASSET_CACHE"

            if [[ "$ASSET_CACHE" != *"immutable"* ]]; then
              echo "❌ Assets의 Cache-Control이 잘못되었습니다"
              exit 1
            fi
          fi

          echo "✅ S3 Cache-Control 검증 완료"

      # 11. 배포 완료 알림
      - name: Deployment Summary
        run: |
          echo "====================================="
          echo "🎉 배포 완료!"
          echo "====================================="
          echo "CloudFront URL: https://$(aws cloudfront get-distribution \
            --id ${{ secrets.CLOUDFRONT_DISTRIBUTION_ID }} \
            --query 'Distribution.DomainName' \
            --output text)"
          echo ""
          echo "검증 항목:"
          echo "✅ S3 업로드"
          echo "✅ Cache-Control 헤더"
          echo "✅ CloudFront 무효화"
          echo "====================================="
