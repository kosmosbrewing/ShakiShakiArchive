<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link
      rel="icon"
      type="image/webp"
      href="./src/assets/optimized/favicon.webp"
    />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="naver-site-verification" content="7224574af286c0f757a10aefea3fdd85ce0afae9" />
    <title>샤키샤키 아카이브(ShakiShaki Archive)</title>

    <!-- DNS Prefetch: DNS 조회 미리 수행 (50-300ms 절약) -->
    <link rel="dns-prefetch" href="https://res.cloudinary.com" />
    <link rel="dns-prefetch" href="https://js.tosspayments.com" />

    <!-- Preconnect: TCP/TLS 핸드셰이크 미리 수행 (100-500ms 절약) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin />
    <link rel="preconnect" href="https://js.tosspayments.com" crossorigin />

    <!-- Critical CSS Inline: LCP 최적화 (폰트 + CSS 변수 + 기본 스타일) -->
    <style>
      /* 1. Nanum Gothic 기본 폰트 - self-hosting */
      @font-face {
        font-family: "Nanum Gothic";
        font-weight: 400;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/NanumGothic-Regular.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nanum Gothic";
        font-weight: 700;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/NanumGothic-Bold.woff2") format("woff2");
      }
      @font-face {
        font-family: "Nanum Gothic";
        font-weight: 800;
        font-style: normal;
        font-display: swap;
        src: url("/fonts/NanumGothic-ExtraBold.woff2") format("woff2");
      }

      /* 2. Pretendard 폰트 - fallback으로 사용 가능 */
      @font-face {
        font-family: "Pretendard";
        font-weight: 400;
        font-style: normal;
        font-display: optional;
        src: url("/fonts/Pretendard-Regular.subset.woff2") format("woff2");
        unicode-range: U+AC00-D7A3, U+0020-007E;
      }
      @font-face {
        font-family: "Pretendard";
        font-weight: 600;
        font-style: normal;
        font-display: optional;
        src: url("/fonts/Pretendard-SemiBold.subset.woff2") format("woff2");
        unicode-range: U+AC00-D7A3, U+0020-007E;
      }

      /* 3. CSS 변수 - Tailwind 색상 시스템 */
      :root {
        --background: 0 0% 100%;
        --foreground: 31 34% 28%;
        --muted-foreground: 20 13% 44%;
        --admin-foreground: 0 0% 9%;
        --admin-muted-foreground: 0 0% 45%;
        --card: 0 0% 100%;
        --card-foreground: 31 34% 28%;
        --popover: 0 0% 100%;
        --popover-foreground: 31 34% 28%;
        --primary: 19 16% 31%;
        --primary-foreground: 0 0% 100%;
        --secondary: 60 4.8% 95.9%;
        --secondary-foreground: 31 34% 28%;
        --muted: 60 4.8% 95.9%;
        --accent: 60 4.8% 95.9%;
        --accent-foreground: 31 34% 28%;
        --destructive: 350 70% 55%;
        --destructive-foreground: 60 9.1% 97.8%;
        --border: 335 10% 90%;
        --input: 20 5.9% 90%;
        --ring: 19 16% 31%;
        --radius: 0.5rem;
      }

      /* 4. 기본 스타일 - 즉시 렌더링 */
      html {
        scroll-behavior: auto;
      }
      body {
        background: hsl(var(--background));
        color: hsl(var(--foreground));
        font-family:
          "Nanum Gothic",
          "나눔고딕",
          "NanumGothic",
          "Pretendard",
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
        overflow-x: hidden;
        margin: 0;
      }
    </style>

    <!-- Preload: 중요 폰트 파일 우선 로드 (LCP 개선) -->
    <!-- Self-hosting: 로컬에서 제공하여 DNS/TCP/TLS 오버헤드 제거 (250-550ms 절약) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/NanumGothic-Regular.woff2"
      crossorigin
    />
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="/fonts/NanumGothic-Bold.woff2"
      crossorigin
    />

    <!-- 기본 제목 -->
    <!--
      NOTE: SEO 메타 태그는 빌드 시점에 Prerendering 스크립트를 통해
      백엔드 API(/api/seo/*)에서 가져온 데이터로 동적 생성됩니다.

      생성되는 메타 태그:
      - <title>
      - <meta name="description">
      - OpenGraph (og:title, og:description, og:image, og:url, og:type, og:site_name, og:locale)
      - Twitter Card (twitter:card, twitter:title, twitter:description, twitter:image)

      실행 방법: npm run build:full
    -->

    <!--
      Performance 최적화: 결제 SDK는 결제 페이지에서 동적 로드
      - 토스페이먼츠 SDK: Order.vue에서 로드
      - FCP/LCP 2-3초 개선 예상
    -->

    <!-- 카카오 JS SDK (공유하기) -->
    <script
      src="https://t1.kakaocdn.net/kakao_js_sdk/2.7.7/kakao.min.js"
      integrity="sha384-tJkjbtDbvoxO+diRuDtwRO9JXR7pjWnfjfRn5ePUpl7e7RJCxKCwwnfqUAdXh53p"
      crossorigin="anonymous"
      defer
    ></script>
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
