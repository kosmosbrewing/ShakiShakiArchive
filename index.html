<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>샤키샤키 아카이브(ShakiShaki Archive)</title>

    <!-- DNS Prefetch: DNS 조회 미리 수행 (50-300ms 절약) -->
    <link rel="dns-prefetch" href="https://res.cloudinary.com">
    <link rel="dns-prefetch" href="https://js.tosspayments.com">
    <link rel="dns-prefetch" href="https://nsp.pay.naver.com">
    <link rel="dns-prefetch" href="https://cdn.jsdelivr.net">

    <!-- Preconnect: TCP/TLS 핸드셰이크 미리 수행 (100-500ms 절약) -->
    <link rel="preconnect" href="https://res.cloudinary.com" crossorigin>
    <link rel="preconnect" href="https://js.tosspayments.com" crossorigin>
    <link rel="preconnect" href="https://nsp.pay.naver.com" crossorigin>
    <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>

    <!-- Preload: 중요 폰트 파일 우선 로드 (LCP 개선) -->
    <!-- Performance 최적화: Regular만 preload (가장 많이 사용, 270KB 절감) -->
    <link
      rel="preload"
      as="font"
      type="font/woff2"
      href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/packages/pretendard/dist/web/static/woff2-subset/Pretendard-Regular.subset.woff2"
      crossorigin>
    <!-- SemiBold, Medium은 필요 시 CSS에서 자동 로드 (preload 제거로 초기 로딩 속도 개선) -->

    <!-- Preload: Hero 이미지 우선 로드 (LCP 개선) -->
    <!-- 극한 최적화: 600x840, Q22, 28.3KB (98.3% 감소) -->
    <link
      rel="preload"
      as="image"
      href="/assets/hero.BEm-f0yL.webp"
      type="image/webp"
      fetchpriority="high">

    <!-- 기본 제목 -->
    <!--
      NOTE: SEO 메타 태그는 빌드 시점에 Prerendering 스크립트를 통해
      백엔드 API(/api/seo/*)에서 가져온 데이터로 동적 생성됩니다.

      생성되는 메타 태그:
      - <title>
      - <meta name="description">
      - OpenGraph (og:title, og:description, og:image, og:url, og:type, og:site_name, og:locale)
      - Twitter Card (twitter:card, twitter:title, twitter:description, twitter:image)

      실행 방법: npm run build:full
    -->

    <!--
      Performance 최적화: 결제 SDK는 결제 페이지에서 동적 로드
      - 토스페이먼츠 SDK: Order.vue에서 로드
      - 네이버페이 SDK: Order.vue에서 로드
      - FCP/LCP 2-3초 개선 예상
    -->
  </head>

  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
