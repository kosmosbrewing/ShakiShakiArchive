<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./src/assets/icon.ico" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- 기본 제목 -->
    <!--
      NOTE: SEO 메타 태그는 빌드 시점에 Prerendering 스크립트를 통해
      백엔드 API(/api/seo/*)에서 가져온 데이터로 동적 생성됩니다.

      생성되는 메타 태그:
      - <title>
      - <meta name="description">
      - OpenGraph (og:title, og:description, og:image, og:url, og:type, og:site_name, og:locale)
      - Twitter Card (twitter:card, twitter:title, twitter:description, twitter:image)

      실행 방법: npm run build:full
    -->

    <!-- 토스페이먼츠 SDK -->

    <!-- 네이버페이 SDK -->

  </head>

    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
