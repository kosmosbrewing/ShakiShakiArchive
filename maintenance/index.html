    <style>
      :root {
        --bg: #ffffff;
        --fg: #1d1d1b;
        --muted: #6b6560;
        --line: #e6e2dd;
        --logo-filter: none;
      }

      /* 사용자 시스템 설정이 다크면 로고(투명 PNG)를 반전시켜 대비를 유지한다 */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14120f;
          --fg: #f3efe9;
          --muted: #a49c93;
          --line: #2e2a25;
          --logo-filter: invert(1);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        padding: 3rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Pretendard", "Malgun Gothic", "Nanum Gothic", "Segoe UI", Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        line-height: 1.7;
      }

      /* 좁은 화면에서 콘텐츠 폭이 뷰포트를 넘지 않도록 min()으로 상한을 건다.
         (width:100%를 빼면 flex 아이템이 콘텐츠 너비만큼 늘어나 가로 스크롤이 생긴다) */
      main,
      footer {
        width: 100%;
        max-width: min(34rem, 100%);
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }

      .logo {
        width: min(15rem, 62vw);
        height: auto;
        filter: var(--logo-filter);
      }

      .label {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.15rem, 4.6vw, 1.75rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        word-break: keep-all;
      }

      .message {
        margin: 0;
        font-size: clamp(0.85rem, 3.4vw, 0.95rem);
        color: var(--muted);
        word-break: keep-all;
      }

      /* 좁은 화면에서는 강제 줄바꿈을 없애고 자연스럽게 흐르게 둔다 */
      @media (max-width: 30rem) {
        .message br {
          display: none;
        }
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.85rem 1.75rem;
        border: 1px solid var(--fg);
        border-radius: 999px;
        color: var(--fg);
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .cta:hover,
      .cta:focus-visible {
        background: var(--fg);
        color: var(--bg);
      }

      .cta svg {
        width: 1.05rem;
        height: 1.05rem;
      }

      .contact {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .contact a {
        color: inherit;
      }

      footer {
        padding-top: 1.75rem;
        border-top: 1px solid var(--line);
        font-size: 0.72rem;
        line-height: 1.75;
        color: var(--muted);
        word-break: keep-all;
      }

      footer p {
        margin: 0;
      }
    </style>
  </head>
