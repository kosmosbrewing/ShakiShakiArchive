<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>샤키샤키 아카이브 | 준비 중</title>
    <meta
      name="description"
      content="샤키샤키 아카이브(ShakiShaki Archive)는 현재 재정비 중입니다. 새 소식은 인스타그램 @shaki.4rc에서 전해드립니다."
    />

    <!-- 모든 경로가 이 페이지로 폴백되므로(존재하지 않는 URL → CloudFront 오류응답 → index.html),
         중복 색인을 막기 위해 루트로 canonical을 고정한다. -->
    <link rel="canonical" href="https://shakishakiarchive.com/" />
    <link rel="icon" type="image/png" href="/favicon.png" />

    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="샤키샤키 아카이브" />
    <meta property="og:title" content="샤키샤키 아카이브 | 준비 중" />
    <meta
      property="og:description"
      content="더 나은 모습으로 준비하고 있습니다. 새 소식은 인스타그램에서 전해드립니다."
    />
    <meta property="og:url" content="https://shakishakiarchive.com/" />
    <meta property="og:locale" content="ko_KR" />
    <meta name="twitter:card" content="summary" />

    <style>
      :root {
        --bg: #ffffff;
        --fg: #1d1d1b;
        --muted: #6b6560;
        --line: #e6e2dd;
        --logo-filter: none;
      }

      /* 사용자 시스템 설정이 다크면 로고(투명 PNG)를 반전시켜 대비를 유지한다 */
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #14120f;
          --fg: #f3efe9;
          --muted: #a49c93;
          --line: #2e2a25;
          --logo-filter: invert(1);
        }
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
      }

      body {
        min-height: 100vh;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2.5rem;
        padding: 3rem 1.5rem;
        background: var(--bg);
        color: var(--fg);
        font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo",
          "Pretendard", "Malgun Gothic", "Nanum Gothic", "Segoe UI", Roboto,
          sans-serif;
        -webkit-font-smoothing: antialiased;
        text-align: center;
        line-height: 1.7;
      }

      /* 좁은 화면에서 콘텐츠 폭이 뷰포트를 넘지 않도록 min()으로 상한을 건다.
         (width:100%를 빼면 flex 아이템이 콘텐츠 너비만큼 늘어나 가로 스크롤이 생긴다) */
      main,
      footer {
        width: 100%;
        max-width: min(34rem, 100%);
      }

      main {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2rem;
      }

      .logo {
        width: min(15rem, 62vw);
        height: auto;
        filter: var(--logo-filter);
      }

      .label {
        margin: 0;
        font-size: 0.72rem;
        font-weight: 600;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--muted);
      }

      h1 {
        margin: 0;
        font-size: clamp(1.15rem, 4.6vw, 1.75rem);
        font-weight: 600;
        letter-spacing: -0.01em;
        word-break: keep-all;
      }

      .message {
        margin: 0;
        font-size: clamp(0.85rem, 3.4vw, 0.95rem);
        color: var(--muted);
        word-break: keep-all;
      }

      /* 좁은 화면에서는 강제 줄바꿈을 없애고 자연스럽게 흐르게 둔다 */
      @media (max-width: 30rem) {
        .message br {
          display: none;
        }
      }

      .cta {
        display: inline-flex;
        align-items: center;
        gap: 0.55rem;
        padding: 0.85rem 1.75rem;
        border: 1px solid var(--fg);
        border-radius: 999px;
        color: var(--fg);
        font-size: 0.9rem;
        font-weight: 600;
        text-decoration: none;
        transition: background-color 0.2s ease, color 0.2s ease;
      }

      .cta:hover,
      .cta:focus-visible {
        background: var(--fg);
        color: var(--bg);
      }

      .cta svg {
        width: 1.05rem;
        height: 1.05rem;
      }

      .contact {
        margin: 0;
        font-size: 0.85rem;
        color: var(--muted);
      }

      .contact a {
        color: inherit;
      }

      footer {
        padding-top: 1.75rem;
        border-top: 1px solid var(--line);
        font-size: 0.72rem;
        line-height: 1.75;
        color: var(--muted);
        word-break: keep-all;
      }

      footer p {
        margin: 0;
      }
    </style>
  </head>

  <body>
    <main>
      <img
        class="logo"
        src="/logo.png"
        alt="샤키샤키 아카이브 (ShakiShaki Archive)"
        width="603"
        height="264"
      />

      <div>
        <p class="label">Coming Soon</p>
        <h1>더 나은 모습으로 준비하고 있습니다</h1>
      </div>

      <p class="message">
        현재 스토어 운영을 잠시 멈추고 재정비 중입니다.<br />
        새 소식과 입고 소식은 인스타그램에서 가장 먼저 전해드립니다.
      </p>

      <a
        class="cta"
        href="https://www.instagram.com/shaki.4rc/"
        target="_blank"
        rel="noopener noreferrer"
      >
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="20" height="20" rx="5" />
          <circle cx="12" cy="12" r="4" />
          <circle cx="17.5" cy="6.5" r="1.1" fill="currentColor" stroke="none" />
        </svg>
        @shaki.4rc
      </a>

      <p class="contact">
        문의 <a href="mailto:381611sug@naver.com">381611sug@naver.com</a>
      </p>
    </main>

    <!-- 전자상거래법상 사업자 정보 표기 의무를 중단 기간에도 유지한다 -->
    <footer>
      <p>샤키샤키 아카이브&ensp;|&ensp;대표 손유진</p>
      <p>경상남도 밀양시 부북면 덕곡2길 203-28</p>
      <p>사업자등록번호 157-18-02463&ensp;|&ensp;통신판매업신고번호 2025-경남밀양-210호</p>
      <p>연락처 010-7347-4088&ensp;|&ensp;이메일 381611sug@naver.com</p>
    </footer>
  </body>
</html>
